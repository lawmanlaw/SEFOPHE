<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4-bedroom house — 3D model</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#f6f4ef}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
  #panel{position:fixed;top:20px;left:20px;z-index:5;display:flex;flex-direction:column;gap:14px;
    padding:14px 16px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    border:1px solid rgba(0,0,0,.1);border-radius:12px;
    font:500 12px/1.3 ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;color:#2b2b28}
  #panel .grp{display:flex;flex-direction:column;gap:7px}
  #panel .lab{text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:#8a877e}
  #panel .row,#swatches{display:flex;gap:7px}
  #panel button{font:inherit;padding:7px 11px;border:1px solid rgba(0,0,0,.14);border-radius:7px;
    background:#fff;color:#2b2b28;cursor:pointer}
  #panel button:hover{background:#f2efe9}
  #panel button[data-on="1"]{background:#2b2b28;color:#fff;border-color:#2b2b28}
  #swatches button{width:30px;height:30px;padding:0;border-radius:50%;position:relative;overflow:hidden}
  #swatches button[data-on="1"]{outline:2px solid #2b2b28;outline-offset:2px}
  #swatches i{position:absolute;inset:0;display:block}
  #swatches i:last-child{top:auto;height:38%}
  #panel .pickers{gap:10px}
  #panel .pickers label{display:flex;flex-direction:column;gap:4px;font-size:10px;color:#8a877e;
    text-transform:uppercase;letter-spacing:.07em}
  #panel input[type="color"]{width:44px;height:22px;padding:0;border:1px solid rgba(0,0,0,.14);
    border-radius:5px;background:#fff;cursor:pointer}
  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;display:none;
    padding:9px 14px;border-radius:8px;background:rgba(30,30,28,.82);color:#fff;
    font:500 12px/1 ui-sans-serif,-apple-system,sans-serif;letter-spacing:.01em}
  body[data-walk="1"] #hint{display:block}
</style>
</head>
<body>
<three-d-stage name="house-4bed" autorotate></three-d-stage>

<div id="panel">
  <div class="grp">
    <span class="lab">Colour</span>
    <div id="swatches"></div>
    <div class="row pickers">
      <label>Walls<input type="color" id="cWall" value="#e9e4da"></label>
      <label>Roof<input type="color" id="cRoof" value="#4a4f55"></label>
      <label>Trim<input type="color" id="cTrim" value="#f7f5f1"></label>
    </div>
  </div>
  <div class="grp">
    <span class="lab">View</span>
    <div class="row">
      <button type="button" id="roofBtn">Hide roof</button>
      <button type="button" id="walkBtn">Free roam</button>
    </div>
  </div>
</div>
<div id="hint">WASD / arrows to move &middot; mouse to look &middot; Q/E up-down &middot; Shift to sprint &middot; Esc to exit</div>
<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const M = {
  plaster:  new THREE.MeshStandardMaterial({ name:'plaster',  color:0xe9e4da, roughness:0.85 }),
  trim:     new THREE.MeshStandardMaterial({ name:'trim',      color:0xf7f5f1, roughness:0.55 }),
  roof:     new THREE.MeshStandardMaterial({ name:'roof_steel',color:0x4a4f55, roughness:0.5, metalness:0.35, side:THREE.DoubleSide }),
  timber:   new THREE.MeshStandardMaterial({ name:'timber',    color:0x7a4a2b, roughness:0.6 }),
  concrete: new THREE.MeshStandardMaterial({ name:'concrete',  color:0xc9c4ba, roughness:0.95 }),
  glass:    new THREE.MeshStandardMaterial({ name:'glass',     color:0x9fc3d4, roughness:0.1, metalness:0.15, transparent:true, opacity:0.45 }),
};

const H = 2.7, TE = 0.22, TI = 0.1;
const house = new THREE.Group(); house.name = 'house_4bed';

function box(name, w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name; m.castShadow = true; m.receiveShadow = true; return m;
}

// Wall along the plan line (ax,az)->(bx,bz). Openings are {start,end,sill,top,kind}
// measured in metres from the a end; kind 'window' | 'door' | 'open'.
function wall(name, ax, az, bx, bz, t, openings = [], h = H) {
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
  const g = new THREE.Group(); g.name = name;
  g.position.set(ax, 0, az);
  g.rotation.y = -Math.atan2(dz, dx);

  const ops = [...openings].sort((p, q) => p.start - q.start);
  const segs = []; let cur = 0;
  for (const o of ops) {
    if (o.start > cur + 1e-6) segs.push([cur, o.start, 0, h]);
    if (o.sill > 0.001) segs.push([o.start, o.end, 0, o.sill]);
    if (o.top < h - 0.001) segs.push([o.start, o.end, o.top, h]);
    cur = o.end;
  }
  if (cur < L - 1e-6) segs.push([cur, L, 0, h]);

  segs.forEach(([s, e, y0, y1], i) => {
    const m = box(name + '_seg' + i, e - s, y1 - y0, t, M.plaster);
    m.position.set((s + e) / 2, (y0 + y1) / 2, 0);
    g.add(m);
  });

  ops.forEach((o, i) => {
    const w = o.end - o.start, hh = o.top - o.sill;
    const cx = (o.start + o.end) / 2, cy = (o.sill + o.top) / 2;
    if (o.kind === 'window') {
      const pane = box(name + '_glass' + i, w - 0.12, hh - 0.12, 0.02, M.glass);
      pane.position.set(cx, cy, 0); g.add(pane);
      const fr = new THREE.Group(); fr.name = name + '_frame' + i;
      const jamb = 0.06, dep = t + 0.03;
      [[-1, 0], [1, 0]].forEach(([sx], k) => {
        const p = box('jamb' + k, jamb, hh, dep, M.trim);
        p.position.set(cx + sx * (w / 2 - jamb / 2), cy, 0); fr.add(p);
      });
      [[-1], [1]].forEach(([sy], k) => {
        const p = box('rail' + k, w, jamb, dep, M.trim);
        p.position.set(cx, cy + sy * (hh / 2 - jamb / 2), 0); fr.add(p);
      });
      const mull = box('mullion', 0.05, hh - 0.12, t * 0.5, M.trim);
      mull.position.set(cx, cy, 0); fr.add(mull);
      const sill = box('sill', w + 0.16, 0.05, t + 0.14, M.trim);
      sill.position.set(cx, o.sill - 0.025, 0); fr.add(sill);
      g.add(fr);
    } else if (o.kind === 'door') {
      const leaf = box(name + '_door' + i, w - 0.08, hh - 0.05, 0.05, M.timber);
      leaf.position.set(cx, (hh - 0.05) / 2 + 0.02, 0); g.add(leaf);
      const cas = new THREE.Group(); cas.name = name + '_casing' + i;
      [[-1], [1]].forEach(([sx], k) => {
        const p = box('jamb' + k, 0.06, hh, t + 0.03, M.trim);
        p.position.set(cx + sx * (w / 2 - 0.03), hh / 2, 0); cas.add(p);
      });
      const head = box('head', w, 0.06, t + 0.03, M.trim);
      head.position.set(cx, hh - 0.03, 0); cas.add(head);
      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.035, 20, 14), M.trim);
      knob.name = 'knob'; knob.position.set(cx + w / 2 - 0.16, 1.02, t / 2 + 0.03); cas.add(knob);
      g.add(cas);
    }
  });
  house.add(g);
  return g;
}

const win = (start, end, sill = 0.95, top = 2.1) => ({ start, end, sill, top, kind: 'window' });
const door = (start, end, top = 2.05) => ({ start, end, sill: 0, top, kind: 'door' });
const gap  = (start, end, top = 2.1) => ({ start, end, sill: 0, top, kind: 'open' });

// ---- slab -------------------------------------------------------------
const slab = box('floor_slab', 8.5, 0.2, 8.5, M.concrete);
slab.position.set(4, -0.1, 4); house.add(slab);
const plinth = box('plinth', 8.5, 0.12, 8.5, M.concrete);
plinth.position.set(4, 0.06, 4); house.add(plinth);

// ---- exterior walls (plan: x 0..8 left→right, z 0..8 back(N)→front) ---
wall('wall_north', 0, 0, 8, 0, TE, [win(0.9, 2.5), win(3.75, 4.65, 1.5, 2.2), win(5.3, 6.9)]);
wall('wall_west',  0, 8, 0, 0, TE, [win(1.9, 3.4), win(5.1, 6.7)]);
wall('wall_south', 8, 8, 0, 8, TE, [
  door(0.6, 1.5, 2.05),      // toilet — own external door (within x 6.5–7.4)
  door(2.15, 3.05, 2.05),    // shower/bath — own external door (within x 4.95–5.85)
  door(3.45, 4.15, 2.1),     // passage — front entrance (within x 3.85–4.55)
  win(6.0, 7.5),             // bedroom 3
]);
wall('wall_east',  8, 0, 8, 8, TE, [win(1.1, 2.6), win(4.6, 5.9), win(6.75, 7.35, 1.6, 2.2)]);

// ---- interior walls ---------------------------------------------------
wall('wall_passage_west', 3.6, 0, 3.6, 8, TI, [door(0.55, 1.45), door(4.35, 5.25)]);
wall('wall_passage_east', 4.8, 0, 4.8, 8, TI, [door(0.55, 1.45), door(4.4, 5.3)]);
wall('wall_bed1_bed3', 0, 4, 3.6, 4, TI);
wall('wall_bed2_bed4', 4.8, 4, 8, 4, TI);
wall('wall_bed4_bath', 4.8, 6.4, 8, 6.4, TI);
wall('wall_shower_toilet', 6.4, 6.4, 6.4, 8, TI);

// ---- ceiling ----------------------------------------------------------
const ceil = box('ceiling', 8.02, 0.08, 8.02, M.plaster);
ceil.position.set(4, H + 0.04, 4); house.add(ceil);

// ---- hipped roof ------------------------------------------------------
const eaveY = H + 0.1, apexY = H + 2.15, o = 0.55;
const A = [-o, eaveY, -o], B = [8 + o, eaveY, -o], C = [8 + o, eaveY, 8 + o], D = [-o, eaveY, 8 + o];
const R1 = [2.6, apexY, 4], R2 = [5.4, apexY, 4];
const tri = (p, q, r) => [...p, ...q, ...r];
const roofGeo = new THREE.BufferGeometry();
roofGeo.setAttribute('position', new THREE.Float32BufferAttribute([
  ...tri(A, B, R2), ...tri(A, R2, R1),   // north slope
  ...tri(C, D, R1), ...tri(C, R1, R2),   // south slope
  ...tri(A, R1, D),                      // west hip
  ...tri(B, C, R2),                      // east hip
], 3));
roofGeo.computeVertexNormals();
const roof = new THREE.Mesh(roofGeo, M.roof);
roof.name = 'roof'; roof.castShadow = true; roof.receiveShadow = true; house.add(roof);

[[4, -o, 8 + 2 * o, 0.16], [4, 8 + o, 8 + 2 * o, 0.16]].forEach(([x, z, w], i) => {
  const f = box('fascia_ns' + i, w, 0.16, 0.05, M.trim);
  f.position.set(x, eaveY - 0.08, z); house.add(f);
});
[[-o, 4], [8 + o, 4]].forEach(([x, z], i) => {
  const f = box('fascia_ew' + i, 0.05, 0.16, 8 + 2 * o, M.trim);
  f.position.set(x, eaveY - 0.08, z); house.add(f);
});

// ---- parking shade (front / street side) ------------------------------
const shade = new THREE.Group(); shade.name = 'parking_shade';
const px = [0.25, 3.95], pz = [8.75, 11.35];
px.forEach((x, i) => pz.forEach((z, j) => {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 2.45, 24), M.trim);
  post.name = `shade_post_${i}${j}`; post.castShadow = true;
  post.position.set(x, 1.225, z); shade.add(post);
}));
const beamA = box('shade_beam_w', 4.1, 0.14, 0.1, M.trim); beamA.position.set(2.1, 2.5, 8.75);
const beamB = box('shade_beam_e', 4.1, 0.14, 0.1, M.trim); beamB.position.set(2.1, 2.42, 11.35);
shade.add(beamA, beamB);
const canopy = box('shade_roof', 4.5, 0.07, 3.0, M.roof);
canopy.position.set(2.1, 2.58, 10.05); canopy.rotation.x = -0.028; shade.add(canopy);
const bay = box('shade_pad', 3.4, 0.09, 2.6, M.concrete);
bay.position.set(2.1, 0.045, 10.05); shade.add(bay);
house.add(shade);

const stoop = box('entry_stoop', 1.5, 0.11, 0.7, M.concrete);
stoop.position.set(4.2, 0.055, 8.5); house.add(stoop);

house.position.set(-4, 0, -4);
const root = new THREE.Group(); root.name = 'house_4bed'; root.add(house);
stage.setObject(root);

// ---- colour schemes ---------------------------------------------------
const SCHEMES = [
  { id: 'plaster',    wall: 0xe9e4da, trim: 0xf7f5f1, roof: 0x4a4f55, timber: 0x7a4a2b },
  { id: 'charcoal',   wall: 0xf2f2f0, trim: 0xffffff, roof: 0x2b2d30, timber: 0x3d3d3f },
  { id: 'terracotta', wall: 0xe3c5a2, trim: 0xfdf6ec, roof: 0x8c3f2b, timber: 0x5a3320 },
  { id: 'sage',       wall: 0xccd3c4, trim: 0xfbfbf8, roof: 0x3f4a42, timber: 0x6b4a2f },
];
const swatches = document.getElementById('swatches');
function applyScheme(i) {
  const s = SCHEMES[i];
  M.plaster.color.setHex(s.wall);
  M.trim.color.setHex(s.trim);
  M.roof.color.setHex(s.roof);
  M.timber.color.setHex(s.timber);
  [...swatches.children].forEach((b, k) => b.dataset.on = k === i ? '1' : '0');
}
SCHEMES.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.title = s.id;
  b.innerHTML = `<i style="background:#${s.wall.toString(16).padStart(6,'0')}"></i>` +
                `<i style="background:#${s.roof.toString(16).padStart(6,'0')}"></i>`;
  b.addEventListener('click', () => applyScheme(i));
  swatches.appendChild(b);
});
applyScheme(0);

const pickers = { cWall: M.plaster, cRoof: M.roof, cTrim: M.trim };
Object.entries(pickers).forEach(([id, mat]) => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    mat.color.set(el.value);
    [...swatches.children].forEach((b) => b.dataset.on = '0');
  });
});
function syncPickers() {
  document.getElementById('cWall').value = '#' + M.plaster.color.getHexString();
  document.getElementById('cRoof').value = '#' + M.roof.color.getHexString();
  document.getElementById('cTrim').value = '#' + M.trim.color.getHexString();
}
swatches.addEventListener('click', syncPickers);
syncPickers();

// ---- room labels (shown with the roof off) ------------------------------
const labels = new THREE.Group(); labels.name = 'room_labels'; labels.visible = false;
[
  ['Bedroom 1 · 3.6×4.0', 1.8, 2.0], ['Bedroom 2 · 3.2×4.0', 6.4, 2.0],
  ['Bedroom 3 · 3.6×4.0', 1.8, 6.0], ['Bedroom 4 · 3.2×2.4', 6.4, 5.2],
  ['Passage', 4.2, 3.2], ['Shower', 5.6, 7.2], ['Toilet', 7.2, 7.2],
  ['Parking shade', 2.1, 10.05],
].forEach(([text, x, z]) => {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g2 = c.getContext('2d');
  g2.fillStyle = 'rgba(255,255,255,0.92)';
  g2.beginPath(); g2.roundRect(6, 26, 500, 76, 38); g2.fill();
  g2.fillStyle = '#2b2b28';
  g2.font = '600 42px ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif';
  g2.textAlign = 'center'; g2.textBaseline = 'middle';
  g2.fillText(text, 256, 65, 470);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ name: 'label', map: tex, transparent: true, depthTest: false }));
  s.name = 'label_' + text.split(' ·')[0].replace(/\s+/g, '_').toLowerCase();
  s.scale.set(2.0, 0.5, 1); s.position.set(x, 1.75, z);
  labels.add(s);
});
house.add(labels);

// ---- roof toggle ------------------------------------------------------
const roofParts = [];
root.traverse((n) => { if (/^(roof|fascia|ceiling)/.test(n.name)) roofParts.push(n); });
const roofBtn = document.getElementById('roofBtn');
let roofOn = true;
roofBtn.addEventListener('click', () => {
  roofOn = !roofOn;
  roofParts.forEach((n) => { n.visible = roofOn; });
  labels.visible = !roofOn;
  roofBtn.textContent = roofOn ? 'Hide roof' : 'Show roof';
  roofBtn.dataset.on = roofOn ? '0' : '1';
});

// ---- free roam --------------------------------------------------------
const cam = stage._camera, orbit = stage._controls;
const canvas = stage.shadowRoot.querySelector('canvas');
const walkBtn = document.getElementById('walkBtn');
const keys = new Set();
let walking = false, yaw = 0, pitch = 0, saved = null, last = performance.now();

function enterWalk() {
  if (walking) return;
  walking = true;
  document.body.dataset.walk = '1';
  walkBtn.dataset.on = '1'; walkBtn.textContent = 'Exit roam';
  saved = { pos: cam.position.clone(), target: orbit.target.clone() };
  orbit.autoRotate = false; orbit.enabled = false;
  const dir = new THREE.Vector3().subVectors(orbit.target, cam.position);
  yaw = Math.atan2(-dir.x, -dir.z); pitch = 0;
  cam.position.set(0.6, 1.62, 6.2);
  canvas.requestPointerLock?.();
}
function exitWalk() {
  if (!walking) return;
  walking = false;
  document.body.dataset.walk = '0';
  walkBtn.dataset.on = '0'; walkBtn.textContent = 'Free roam';
  if (document.pointerLockElement) document.exitPointerLock();
  cam.position.copy(saved.pos); orbit.target.copy(saved.target);
  cam.lookAt(saved.target);
  orbit.enabled = true; orbit.update();
}
walkBtn.addEventListener('click', () => (walking ? exitWalk() : enterWalk()));
canvas.addEventListener('click', () => { if (walking && !document.pointerLockElement) canvas.requestPointerLock?.(); });
document.addEventListener('mousemove', (e) => {
  if (!walking || !document.pointerLockElement) return;
  yaw -= e.movementX * 0.0022;
  pitch = Math.max(-1.2, Math.min(1.2, pitch - e.movementY * 0.0022));
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return exitWalk();
  if (!walking) return;
  keys.add(e.key.toLowerCase());
  if (['w','a','s','d','q','e',' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

const fwd = new THREE.Vector3(), side = new THREE.Vector3();
(function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!walking) return;
  cam.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  const has = (...k) => k.some((x) => keys.has(x));
  const speed = (has('shift') ? 4.6 : 1.9) * dt;
  fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  side.set(Math.cos(yaw), 0, -Math.sin(yaw));
  if (has('w', 'arrowup')) cam.position.addScaledVector(fwd, speed);
  if (has('s', 'arrowdown')) cam.position.addScaledVector(fwd, -speed);
  if (has('d', 'arrowright')) cam.position.addScaledVector(side, speed);
  if (has('a', 'arrowleft')) cam.position.addScaledVector(side, -speed);
  if (has('e')) cam.position.y += speed;
  if (has('q')) cam.position.y -= speed;
  cam.position.y = Math.max(0.4, Math.min(9, cam.position.y));
})(performance.now());
</script>
</body>
</html>
